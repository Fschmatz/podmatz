name: podmatz
description: "Local podcast player made with Flutter."
publish_to: 'none'
version: 1.1.4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  motor: ^1.1.0
  gap: ^3.0.1
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  file_picker: ^13.1.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.5
  path: ^1.9.0
  material_shapes:
    path: packages/material_shapes
  dynamic_system_colors: ^1.9.0
  just_audio: ^0.10.6
  audio_service: ^0.18.18

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

